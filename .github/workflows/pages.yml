# Publica o painel no GitHub Pages copiando os arquivos do site para a
# branch gh-pages a cada push na branch principal do painel.
name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/zen-gauss-x082qz]
    paths: ["index.html", "css/**", "js/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r index.html css js _site/
          touch _site/.nojekyll
      - name: Enviar para gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica painel (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
